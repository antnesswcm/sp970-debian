name: Build

on:
  workflow_dispatch:

jobs:
  build:
    # arm64 原生 runner：debootstrap 无需 qemu 模拟（x86 runner 上模拟 arm64 极慢，曾 45min+ 卡死）
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: sudo sh -e scripts/install_deps.sh

      - name: Build hyp and aboot firmware
        run: sudo sh -e scripts/build_hyp_aboot.sh

      - name: Extract MSM8916 firmware
        run: sudo sh -e scripts/extract_fw.sh

      - name: Fetch SP970 firmware (wcnss + modem)
        run: |
          # 私有 WCNSS/modem blob 由 sp970-alpine 公开仓托管（firmware/ 子树）
          # 稀疏克隆减少流量（~40MB），避免把 blob 提交进 sp970-debian
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/antnesswcm/sp970-alpine.git fw-src
          git -C fw-src sparse-checkout set firmware/sp970 firmware/modem/sp970
          mkdir -p fw
          cp -a fw-src/firmware/sp970 fw/
          cp -a fw-src/firmware/modem fw/
          ls -la fw/sp970 | head -3
          ls -la fw/modem/sp970 | head -3

      - name: Create rootfs
        # sudo 默认 env_reset 会剥离 env → 用 sudo -E 保留 SP970_FIRMWARE_DIR
        run: sudo -E sh -e scripts/debootstrap.sh
        env:
          SP970_FIRMWARE_DIR: ${{ github.workspace }}/fw

      - name: Verify firmware injection (wcnss + modem)
        run: |
          echo "=== /lib/firmware wcnss files ==="
          ls -la rootfs/lib/firmware/ | grep -E 'wcnss|mba|modem' || echo "(MISSING!)"
          echo "=== wlan/prima ==="
          ls -la rootfs/lib/firmware/wlan/prima/ 2>/dev/null || echo "(MISSING!)"
          echo "=== usb ncm script ==="
          ls -la rootfs/usr/sbin/sp970-usb-ncm.sh 2>/dev/null || echo "(MISSING!)"
          echo "=== systemd unit content (must NOT be a bare path) ==="
          for f in usb-gadget.service msm-firmware-loader.service sp970-led.service; do
            echo "--- $f ---"
            head -3 rootfs/etc/systemd/system/$f 2>/dev/null || echo "(MISSING!)"
          done
          echo "=== wants symlinks ==="
          ls -la rootfs/etc/systemd/system/multi-user.target.wants/ | grep -E 'usb-gadget|msm-firmware' || echo "(MISSING!)"

      - name: Build gadget-tool
        run: sudo sh -e scripts/build_gt.sh

      - name: Create images
        run: sudo sh -e scripts/build_images.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openstick-debian
          path: files/*
